<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Gestión de Ítems</h2>
    <button 
      class="btn btn-primary" 
      [routerLink]="isAdmin ? '/dashboard/items/nuevo' : null" 
      [disabled]="!isAdmin">
      Nuevo Ítem
    </button>
  </div>
  <hr>

  <!-- Mensajes de carga o error -->
  <div *ngIf="loading" class="alert alert-info">Cargando registros...</div>
  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <!-- Cuadrícula de Cards de Ítems -->
  <div *ngIf="!loading && !errorMessage && items.length > 0" class="row">
    <div class="col-md-3 mb-3" *ngFor="let item of items">
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex flex-column justify-content-between">
          <div>
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="text-muted small">ID: #{{ item.id }}</span>
              <span class="badge" [ngClass]="item.isService ? 'bg-info text-dark' : 'bg-secondary'">
                {{ item.isService ? 'Servicio' : 'Ítem' }}
              </span>
            </div>
            <h5 class="card-title text-primary mb-2">{{ item.description }}</h5>
            <p class="card-text mb-1 small"><strong>Cantidad:</strong> {{ item.quantity }}</p>
            <p class="card-text fw-bold text-success mb-3">${{ item.unitPrice | number:'1.2-2' }}</p>
          </div>
          
          <div class="d-flex justify-content-between" *ngIf="isAdmin">
            <button 
              class="btn btn-warning btn-sm w-50 me-1" 
              [routerLink]="['/dashboard/items/editar', item.id]">
              Editar
            </button>
            <button 
              class="btn btn-danger btn-sm w-50" 
              (click)="deleteItem(item.id)">
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mensaje si la lista está vacía -->
  <div *ngIf="!loading && !errorMessage && items.length === 0" class="alert alert-warning">
    No se encontraron ítems registrados en el sistema.
  </div>
</div>
