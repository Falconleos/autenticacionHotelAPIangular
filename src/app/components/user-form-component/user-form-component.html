<div class="container mt-4">
  <h2>Crear Nuevo Usuario (Huésped)</h2>
  <hr>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <form (ngSubmit)="onSubmit()" #userForm="ngForm" class="row g-3">
    <div class="col-md-6">
      <label for="username" class="form-label">Nombre de Usuario (Username) *</label>
      <input type="text" id="username" class="form-control" name="username" [(ngModel)]="formData.username" required minlength="3" #username="ngModel">
    </div>

    <div class="col-md-6">
      <label for="password" class="form-label">Contraseña *</label>
      <input type="password" id="password" class="form-control" name="password" [(ngModel)]="formData.password" required minlength="6" #password="ngModel">
    </div>

    <div class="col-md-6">
      <label for="name" class="form-label">Nombre *</label>
      <input type="text" id="name" class="form-control" name="name" [(ngModel)]="formData.name" required #name="ngModel">
    </div>

    <div class="col-md-6">
      <label for="surname" class="form-label">Apellido *</label>
      <input type="text" id="surname" class="form-control" name="surname" [(ngModel)]="formData.surname" required #surname="ngModel">
    </div>

    <div class="col-md-4">
      <label for="dni" class="form-label">DNI *</label>
      <input type="text" id="dni" class="form-control" name="dni" [(ngModel)]="formData.dni" required #dni="ngModel">
    </div>

    <div class="col-md-4">
      <label for="email" class="form-label">Correo Electrónico *</label>
      <input type="email" id="email" class="form-control" name="email" [(ngModel)]="formData.email" required email #email="ngModel">
    </div>

    <div class="col-md-4">
      <label for="phoneNumber" class="form-label">Teléfono *</label>
      <input type="text" id="phoneNumber" class="form-control" name="phoneNumber" [(ngModel)]="formData.phoneNumber" required #phone="ngModel">
    </div>

    <div class="col-md-6">
      <label for="birthDay" class="form-label">Fecha de Nacimiento</label>
      <input type="date" id="birthDay" class="form-control" name="birthDay" [(ngModel)]="formData.birthDay">
    </div>

    <div class="col-md-6">
      <label for="roleDisplay" class="form-label">Rol Asignado</label>
      <input type="text" id="roleDisplay" class="form-control bg-light" [value]="formData.role" disabled>
    </div>

    <div class="col-12 d-flex justify-content-between align-items-center mt-4">
      <button type="button" class="btn btn-secondary" routerLink="/dashboard/usuarios">
        Volver al Listado
      </button>
      <button type="submit" class="btn btn-success" [disabled]="loading">
        {{ loading ? 'Guardando...' : 'Crear Usuario' }}
      </button>
    </div>
  </form>
</div>
