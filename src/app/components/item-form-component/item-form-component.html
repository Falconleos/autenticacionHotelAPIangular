<div class="container mt-4 mb-5" style="max-width: 600px;">
  <div class="d-flex justify-content-between align-items-center">
    <h2>{{ isEditMode ? 'Editar Ítems' : 'Crear Nuevo Ítem' }}</h2>
    <!-- Indicador visual claro del tipo seleccionado -->
    <span class="badge fs-6 px-3 py-2" [ngClass]="item.isService ? 'bg-info text-dark' : 'bg-secondary'">
      {{ item.isService ? 'Modo: Servicio (Cantidad fija)' : 'Modo: Ítem Estándar' }}
    </span>
  </div>
  <hr>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="loading && isEditMode" class="alert alert-info">Cargando datos del ítem...</div>

  <form (ngSubmit)="onSubmit()" *ngIf="!loading || !isEditMode">
    
    <!-- Checkbox para Servicio -->
    <div class="mb-3 form-check">
      <input 
        type="checkbox" 
        id="isService" 
        class="form-check-input" 
        [(ngModel)]="item.isService" 
        name="isService"
        (change)="onServiceChange()">
      <label class="form-check-label fw-bold" for="isService">
        ¿Es un servicio? (La cantidad será fija en 1)
      </label>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label fw-bold">Descripción</label>
      <input 
        type="text" 
        id="description" 
        class="form-control" 
        [(ngModel)]="item.description" 
        name="description" 
        required 
        placeholder="Ej. Tasa de limpieza, Lavandería...">
    </div>

    <div class="mb-3">
      <label for="quantity" class="form-label fw-bold">Cantidad</label>
      <input 
        type="number" 
        id="quantity" 
        class="form-control" 
        [(ngModel)]="item.quantity" 
        name="quantity" 
        min="1" 
        [disabled]="!!item.isService"
        required>
      <div *ngIf="item.isService" class="form-text text-muted">
        Al ser un servicio, la cantidad está bloqueada en 1 de forma permanente.
      </div>
    </div>

    <div class="mb-3">
      <label for="unitPrice" class="form-label fw-bold">Precio Unitario ($)</label>
      <input 
        type="number" 
        id="unitPrice" 
        class="form-control" 
        [(ngModel)]="item.unitPrice" 
        name="unitPrice" 
        step="0.01" 
        min="0.01" 
        required>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-4">
      <button type="button" class="btn btn-secondary" routerLink="/dashboard/items">Cancelar</button>
      <button type="submit" class="btn btn-success" [disabled]="loading">
        {{ loading ? 'Guardando...' : (isEditMode ? 'Actualizar Ítem' : 'Crear Ítem') }}
      </button>
    </div>
  </form>
</div>
