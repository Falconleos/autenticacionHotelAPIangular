<div class="container mt-4">
  <h2>Nueva Habitación Física</h2>
  <hr>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <form [formGroup]="roomForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="number" class="form-label">Número de Habitación</label>
      <input 
        type="number" 
        id="number" 
        class="form-control" 
        formControlName="number" 
        placeholder="Ej. 101">
      <div *ngIf="roomForm.get('number')?.touched && roomForm.get('number')?.invalid" class="text-danger small mt-1">
        <span *ngIf="roomForm.get('number')?.errors?.['required']">El número es obligatorio.</span>
        <span *ngIf="roomForm.get('number')?.errors?.['min']">Debe ser un número positivo.</span>
      </div>
    </div>

    <div class="mb-3">
      <label for="roomTypeId" class="form-label">Tipo de Habitación</label>
      <select id="roomTypeId" class="form-control" formControlName="roomTypeId">
        <option value="" disabled>Seleccione un tipo de habitación</option>
        <option *ngFor="let type of roomTypes" [value]="type.id">
          {{ type.name }} - Capacidad: {{ type.capacity }} - ${{ type.pricePerNight }}/noche
        </option>
      </select>
      <div *ngIf="roomForm.get('roomTypeId')?.touched && roomForm.get('roomTypeId')?.invalid" class="text-danger small mt-1">
        <span *ngIf="roomForm.get('roomTypeId')?.errors?.['required']">Debe seleccionar un tipo de habitación.</span>
      </div>
    </div>

    <div class="d-flex justify-content-between">
      <button type="submit" class="btn btn-success" [disabled]="loading || loadingTypes">
        Crear Habitación
      </button>
      <button type="button" class="btn btn-secondary" routerLink="/dashboard/rooms">
        Cancelar
      </button>
    </div>
  </form>
</div>
