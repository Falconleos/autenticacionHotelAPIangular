<div class="dashboard-layout">
  <!-- Barra Lateral (Sidebar) -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Hotel Manager</h2>
    </div>
    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      <a routerLink="/dashboard/bookings" routerLinkActive="active">Reservas (Booking)</a>
      <a routerLink="/dashboard/check-ins" routerLinkActive="active" class="nav-link">
          Estadías (Check-Ins)
      </a>
      <!-- Menús separados -->
      <a routerLink="/dashboard/rooms" routerLinkActive="active">Habitaciones</a>
      <a routerLink="/dashboard/items" routerLinkActive="active">Items</a>
      <a routerLink="/dashboard/comments" routerLinkActive="active">Comentarios</a> <!-- <--- Enlace agregado -->
      <!-- Fin de menús separados -->
      <a routerLink="/dashboard/payments" routerLinkActive="active">Pagos</a>
      <a routerLink="/dashboard/accounts" routerLinkActive="active">Cuentas</a>
      <a routerLink="/dashboard/usuarios" routerLinkActive="active">Usuarios</a>
      <a routerLink="/dashboard/employees" routerLinkActive="active">Empleados</a>
    </nav>
    <div class="sidebar-footer">
      <button (click)="logout()" class="btn-logout">Cerrar Sesión</button>
    </div>
  </aside>

  <!-- Contenido Principal -->
  <main class="main-content">
    <header class="top-bar">
      <h3>Panel de Administración</h3>
      <span class="user-info">
        Bienvenido, <strong>{{ username }}</strong> 
        <span class="text-muted" *ngIf="userRoles">({{ userRoles }})</span>
      </span>
    </header>
    
    <div class="content-area">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
