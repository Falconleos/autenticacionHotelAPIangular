<div class="login-container">
  <div class="login-card">
    <h2>Hotel Management</h2>
    <p class="subtitle">Inicia sesión para continuar</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input 
          id="username" 
          type="text" 
          formControlName="username" 
          placeholder="Ingresa tu usuario"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password" 
          type="password" 
          formControlName="password" 
          placeholder="Ingresa tu contraseña"
        />
      </div>

      <div *ngIf="errorMessage" style="display: block; background-color: #f8d7da; color: #721c24; padding: 10px; margin: 10px 0; border: 1px solid #f5c6cb; border-radius: 4px;">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loading" class="btn-login">
        {{ loading ? 'Ingresando...' : 'Entrar' }}
      </button>
    </form>
  </div>
</div>
